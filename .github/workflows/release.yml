name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  wheels:
    uses: ./.github/workflows/wheels.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  notebooks:
    name: Release wheels and notebooks
    needs: wheels
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: wheelhouse

      - name: Check version, package notebooks and upload
        run: |
          project_version=$(python3 ci/version.py)
          if [[ "$project_version" != "${RELEASE_TAG#v}" ]]; then
            echo "::error::Derived version $project_version does not match release tag $RELEASE_TAG. Check the checkout, fetched tags and STRAHLER_VERSION."
            exit 1
          fi
          ci/build-notebooks-zip.sh "$project_version" wheelhouse dist
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" || gh release create "$RELEASE_TAG" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" wheelhouse/*.whl dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"

  package:
    needs: notebooks
    name: Release ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            arch: x86_64
            cc: clang-18
            cxx: clang++-18
          - os: macos-15
            platform: macos-arm64
            arch: arm64
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Check release and architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 graphviz libboost-dev ninja-build pipx
          pipx install meson==1.8.5

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install boost graphviz meson ninja

      - name: Check release version
        run: |
          project_version=$(python3 ci/version.py)
          if [[ "$project_version" != "${RELEASE_TAG#v}" ]]; then
            echo "::error::Derived version $project_version does not match release tag $RELEASE_TAG. Check the checkout, fetched tags and STRAHLER_VERSION."
            exit 1
          fi

      - name: Build and test
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            BOOST_ROOT="$(brew --prefix boost)"
            export BOOST_ROOT
          fi
          meson setup build-release --buildtype=release -Dwerror=true -Dlenstree=enabled --prefix=/ --bindir=bin
          meson compile -C build-release
          meson test -C build-release --print-errorlogs

      - name: Package and upload
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=${RELEASE_TAG#v}
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z._+-]*$ ]]; then
            echo "Release tag must be a version, optionally prefixed with v" >&2
            exit 1
          fi
          name="strahler-tree-experiments-$version-$PLATFORM"
          meson install -C build-release --no-rebuild --destdir "$PWD/package/$name"
          cp README.md LICENSE LICENSE-APACHE-2.0 "package/$name/"
          tar -czf "$name.tar.gz" -C package "$name"
          gh release upload "$RELEASE_TAG" "$name.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
