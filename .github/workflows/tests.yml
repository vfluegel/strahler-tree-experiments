name: tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  wheels:
    uses: ./.github/workflows/wheels.yml

  notebooks:
    name: Notebooks release zip
    needs: wheels
    runs-on: ubuntu-24.04
    env:
      STRAHLER_VERSION: ${{ needs.wheels.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: wheelhouse

      - name: Build and check notebooks zip
        run: |
          python3 tests/test_notebooks_zip.py
          version=$(python3 ci/version.py)
          ci/build-notebooks-zip.sh "$version" wheelhouse dist
          unzip -q "dist/strahler-notebooks-$version.zip" -d "$RUNNER_TEMP/notebooks"
          cd "$RUNNER_TEMP/notebooks/strahler-notebooks-$version"
          test -f README.md
          test -f "wheels/strahler-$version-py3-none-manylinux_2_28_x86_64.whl"
          test -f "wheels/strahler-$version-py3-none-macosx_11_0_arm64.whl"
          python3 -m venv "$RUNNER_TEMP/notebooks-smoke"
          "$RUNNER_TEMP/notebooks-smoke/bin/python" -m pip install --no-index --find-links ./wheels "strahler==$version"
          "$RUNNER_TEMP/notebooks-smoke/bin/python" -m pip install --dry-run -r requirements.txt
          "$RUNNER_TEMP/notebooks-smoke/bin/python" -I "$GITHUB_WORKSPACE/tests/smoke_wheel.py" "$version"

      - uses: actions/upload-artifact@v7
        with:
          name: notebooks
          path: dist/*.zip
          if-no-files-found: error

  format:
    name: Formatting and script checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 shellcheck

      - name: Check C and C++ formatting
        run: ci/check-format.sh --check

      - name: Check shell scripts
        run: shellcheck ci/*.sh tests/*.sh

      - name: Check GitHub Actions workflows
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

      - name: Check Python syntax
        run: python3 -m py_compile src/convert_out.py scripts/compare_oink.py scripts/gen_decomp.py scripts/make_trees.py scripts/gen_keiren.py tests/test_gen_decomp.py tests/test_make_trees.py tests/test_gen_keiren.py tests/test_pg_game_property.py tests/test_pg_game_memory.py tests/test_cli.py tests/test_source_version.py ci/version.py tests/test_version.py

  decomp:
    name: Tracked decompositions
    timeout-minutes: 60
    if: >-
      github.event_name != 'push' || github.actor != 'github-actions[bot]' ||
      !contains(github.event.head_commit.message, 'chore: regenerate decompositions [skip ci]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: decomp-${{ github.ref }}
      cancel-in-progress: true
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y clang-18 graphviz ninja-build pipx
          pipx install meson==1.8.5

      - name: Build release tools and check wrapper
        run: |
          meson setup "$TMPDIR/decomp-build" --buildtype=release -Db_ndebug=true -Dlenstree=disabled -Dwerror=true
          meson compile -C "$TMPDIR/decomp-build" pg2adot pg2pmdot
          meson test -C "$TMPDIR/decomp-build" test_gen_decomp --print-errorlogs

      - name: Check tracked decompositions
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: python3 scripts/gen_decomp.py --build-dir "$TMPDIR/decomp-build" --check

      - name: Regenerate on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/gen_decomp.py --build-dir "$TMPDIR/decomp-build"

      - name: Commit changed decompositions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add -- decomp/ DECOMP.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: regenerate decompositions [skip ci]'
            git push origin HEAD:main
          fi

      - name: Upload decompositions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: decomp
          path: |
            decomp/
            DECOMP.md

      - name: Remove scratch build
        if: always()
        run: rm -rf "$TMPDIR/decomp-build"

  oink-oracle:
    name: Live Oink progress-measure oracle
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          printf 'TMPDIR=%s\nOINK_BIN=%s/oink-build/oink\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build pipx libboost-filesystem-dev libboost-iostreams-dev libboost-random-dev libboost-regex-dev
          pipx install meson==1.8.5

      - name: Build pinned print-pms Oink
        run: |
          git clone --branch print-pms https://github.com/vfluegel/oink.git "$TMPDIR/oink-src"
          git -C "$TMPDIR/oink-src" checkout --detach 51c2640fe650fd18d9331cfe5133cf3605a98c31
          # Fix only upstream printer defects; see tests/README.md.
          git -C "$TMPDIR/oink-src" apply "$GITHUB_WORKSPACE/scripts/oink-print-pms.patch"
          cmake -S "$TMPDIR/oink-src" -B "$TMPDIR/oink-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DOINK_BUILD_TOOLS=OFF -DOINK_BUILD_TESTS=OFF
          cmake --build "$TMPDIR/oink-build" --target solve --parallel 2

      - name: Compare 500 seeded games per algorithm and quick examples
        run: |
          meson setup "$TMPDIR/strahler-build" --buildtype=debug -Dwerror=true -Dlenstree=disabled
          meson compile -C "$TMPDIR/strahler-build" pg2pmdot
          meson test -C "$TMPDIR/strahler-build" oink-oracle --print-errorlogs

      - name: Upload mismatch reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: oink-oracle-failures
          path: ${{ runner.temp }}/strahler-build/oink-failures
          if-no-files-found: ignore

      - name: Remove scratch builds
        if: always()
        run: rm -rf "$TMPDIR/oink-src" "$TMPDIR/oink-build" "$TMPDIR/strahler-build"

  clang-build-test:
    name: Clang 18 build and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 graphviz libboost-dev ninja-build pipx
          pipx install meson==1.8.5

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: meson setup build-clang --buildtype=debug -Dwerror=true -Dlenstree=enabled

      - name: Build
        run: meson compile -C build-clang

      - name: Test
        run: meson test -C build-clang --print-errorlogs

  gcc-build-test:
    name: GCC 14 build and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 gcc-14 graphviz libboost-dev ninja-build pipx
          pipx install meson==1.8.5

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: meson setup build-gcc --buildtype=debug -Dwerror=true -Dlenstree=enabled

      - name: Build
        run: meson compile -C build-gcc

      - name: Test
        run: meson test -C build-gcc --print-errorlogs

  clang-tidy:
    name: Clang-Tidy 18
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 libboost-dev ninja-build pipx
          pipx install meson==1.8.5

      - name: Configure compilation database
        env:
          CC: clang-18
          CXX: clang++-18
        run: meson setup build-tidy --buildtype=debug -Dwerror=true -Dlenstree=enabled

      - name: Build before analysis
        run: meson compile -C build-tidy

      - name: Analyze
        run: ci/check-tidy.sh build-tidy

  coverage-87:
    name: GCC 14 coverage (minimum 87%)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 gcc-14 gcovr graphviz libboost-dev ninja-build pipx
          pipx install meson==1.8.5

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: meson setup build-coverage --buildtype=debug -Db_coverage=true -Dwerror=true -Dlenstree=enabled

      - name: Build and test
        env:
          GCOV: gcov-14
        run: |
          meson compile -C build-coverage
          meson test -C build-coverage --print-errorlogs

      - name: Generate reports and enforce threshold
        run: |
          gcovr \
            --root . \
            --filter '^src/' \
            --gcov-executable gcov-14 \
            --gcov-object-directory build-coverage \
            --txt build-coverage/coverage.txt \
            --xml-pretty \
            --xml build-coverage/coverage.xml \
            --html-details build-coverage/coverage.html \
            --print-summary \
            --fail-under-line 87

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            build-coverage/coverage.txt
            build-coverage/coverage.xml
            build-coverage/coverage.html
            build-coverage/coverage.*.html

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 graphviz libboost-dev ninja-build pipx
          pipx install meson==1.8.5

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: meson setup build-sanitizers --buildtype=debug -Db_sanitize=address,undefined -Db_lundef=false -Dwerror=true -Dlenstree=enabled

      - name: Build
        run: meson compile -C build-sanitizers

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: meson test -C build-sanitizers --print-errorlogs

  valgrind:
    name: Valgrind memory and leak checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 gcc-14 graphviz libboost-dev ninja-build pipx valgrind
          pipx install meson==1.8.5

      - name: Configure and build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          meson setup build-valgrind --buildtype=debug -Dwerror=true -Dlenstree=enabled
          meson compile -C build-valgrind

      - name: Check memory and leaks
        run: ci/check-valgrind.sh build-valgrind

  python-package:
    name: Python package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          echo 'CC=gcc-14' >> "$GITHUB_ENV"
          echo 'CXX=g++-14' >> "$GITHUB_ENV"

      - name: Check target architecture
        run: |
          python -c "import platform; assert platform.machine() == ('arm64' if platform.system() == 'Darwin' else 'x86_64')"

      - name: Install build and test tools
        run: python -m pip install meson==1.8.5 meson-python ninja pytest anywidget traitlets nbclient nbformat ipykernel

      - name: Install browser test tools
        if: runner.os == 'Linux'
        id: playwright
        run: |
          python -m pip install playwright
          echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium headless shell
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium headless shell and system dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Build native API and run package tests through Meson
        run: |
          meson setup "$RUNNER_TEMP/py-build" --buildtype=debug -Dpython=enabled -Dlenstree=disabled -Dwerror=true
          meson compile -C "$RUNNER_TEMP/py-build"
          meson test -C "$RUNNER_TEMP/py-build" test_strahler test_strahler_alloc test_python test_widgets --print-errorlogs

      - name: Test offline widgets in Chromium
        if: runner.os == 'Linux'
        run: meson test -C "$RUNNER_TEMP/py-build" test_widgets_browser --print-errorlogs

      - name: Install the package for notebook kernels
        # The notebooks' first cell compares the installed package metadata with the library.
        run: python -m pip install --no-build-isolation --config-settings=build-dir="$RUNNER_TEMP/py-wheel" .

      - name: Execute notebooks with the test interpreter
        run: meson test -C "$RUNNER_TEMP/py-build" test_notebooks --print-errorlogs
